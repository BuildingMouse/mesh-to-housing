losses:
  surface:
    type: combined
    terms:
      uncovered:
        loss: {type: uncovered_surface, grid: &grid {resolution: 16}, skin_only: true}
        loss_scale: 1
      excess:
        loss: {type: excess_surface, grid: *grid}
        loss_scale: 1
proposals:
  pool: {type: random_pool, grid: *grid, centers: 16, orientations: 4, scales: 2}
  residual: {type: residual, grid: *grid, spots: 4, spins: 2, scales: 2}
steps:
  - stage: fill
    minimize: surface
    candidates: {fixed: [pool], refreshed: [residual], refresh_every: 3}
    steps:
      - type: fill
